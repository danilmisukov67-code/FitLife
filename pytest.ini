[pytest]
norecursedirs = 
    env
    venv
    .git
    __pycache__
    .pytest_cache
    .tox
    .mypy_cache
    build
    dist
    *.egg-info

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

addopts = 
    --tb=short
    -vv
    -p no:cacheprovider
    --assert=plain
    --show-capture=no
    --strict-markers
    --strict-config
    --disable-warnings

testpaths = tests/

python_files = 
    test_*.py
    *_test.py

python_classes = 
    Test*
    *Test

python_functions = 
    test_*
    *_test

# Опционально: определение маркеров
markers =
    slow: медленные тесты (deselect with '-m "not slow"')
    fast: быстрые тесты
    integration: интеграционные тесты
    unit: модульные тесты
    smoke: smoke-тесты для быстрой проверки

# Опционально: настройки логирования
log_cli = false
log_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Опционально: настройки покрытия кода (если используется pytest-cov)
# addopts = --cov=fit_life --cov-report=term-missing --cov-report=html